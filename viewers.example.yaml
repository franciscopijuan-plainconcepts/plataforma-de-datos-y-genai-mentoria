# viewers.example.yaml — Fallback viewer configuration for escape hatches.
#
# HOW VIEWERS WORK IN THIS PROJECT:
#
# By default, `ask --viewer <id>` resolves a REAL PERSON from the `People`
# table (the canonical governance mapping per constitution Principle IV).
# The People table has 24 rows, each mapping a person to a single region:
#
#   Person                    -> Region
#   Marilène Rousseau         -> Caribbean
#   Nicodemo Bautista         -> Central America
#   Lon Bonher                -> Central US
#   Derrick Snyders           -> Western US
#   Flannery Newton           -> Southern US
#   Andile Ihejirika          -> Central Africa
#   ... (24 people total — see `data_dictionary.md` People table)
#
# You do NOT need to list people in this file. The system reads People
# directly. For example:
#
#   uv run python -m src.cli.main ask --viewer marilene_rousseau "total sales"
#   uv run python -m src.cli.main ask --viewer "Marilène Rousseau" "total sales"
#   uv run python -m src.cli.main ask --viewer "Marilene Rousseau" "total sales"
#
# All three resolve to the same person (Caribbean region).
#
# THIS FILE IS ONLY FOR FALLBACK VIEWERS:
#
# Use this file for viewers that do NOT correspond to a real person in the
# People table — e.g., escape hatches, CI service accounts, or role-based
# viewers that span multiple regions for operational purposes.
#
# Copy this file to `viewers.yaml` (gitignored — local only) and edit:
#     cp viewers.example.yaml viewers.yaml
#
# Each viewer entry:
#   id                  : viewer identifier (snake_case; used by `ask --viewer <id>`)
#   regions             : list of `Orders."Region"` values the viewer may see.
#                         Empty list + allows_full_access=false => viewer sees 0 rows.
#   allows_full_access   : if true, the resolver skips RLS filtering. ONLY effective
#                         when ENV in {local, dev, test}; otherwise it is ignored
#                         (forced to false) — governance is non-negotiable.

viewers:
  # Local-dev escape hatch: no RLS filtering. ONLY honored when ENV=local/dev/test.
  # In any other environment, allows_full_access is forced to false by the registry.
  - id: admin_dev
    regions: []
    allows_full_access: true

  # CI smoke-test account: no access to any region (0 rows for every query).
  # Useful for CI pipelines that only verify the pipeline runs without errors,
  # without needing to assert specific data values.
  - id: ci_smoke_test
    regions: []
    allows_full_access: false
